<!DOCTYPE html>
<html>
<head>
    <title>Tomato Leaf Disease Detection</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:50px;
            background:#f2f2f2;
        }

        .box{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        img{
            margin-top:20px;
            width:300px;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Tomato Leaf Disease Detection</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if result %}

        <h2>Prediction: {{ result }}</h2>

        <img src="{{ image_path }}">

    {% endif %}

</div>

</body>
</html>
