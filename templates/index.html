<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafScan AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

     body{
         min-height:100vh;
         display:flex;
         justify-content:center;
         align-items:center;
    background:linear-gradient(-45deg,#56ab2f,#a8e063,#00c853,#43a047);
        background-size:400% 400%;
        animation:gradientBG 10s ease infinite;
        font-family:Arial,sans-serif;
        padding:20px;
}

@keyframes gradientBG{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}


        .container{
            width:90%;
            max-width:650px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            padding:35px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            color:white;
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .progress-bar{
            width:100%;
            background:#ddd;
            border-radius:20px;
            overflow:hidden;
            margin-top:10px;
        }

        .progress{
            background:linear-gradient(to right,#00c853,#64dd17);
            padding:10px;
            color:white;
            font-weight:bold;
            text-align:center;
        }

        h1{
            font-size:48px;
            margin-bottom:20px;
            animation:pulse 2s infinite;
        }

        .tagline{
            font-size:18px;
            color:#f1f1f1;
            margin-bottom:25px;
        }

        h1{
            font-size:42px;
            margin-bottom:10px;
        }

        p{
            margin-bottom:25px;
            font-size:18px;
        }

        input[type="file"]{
            margin:20px 0;
            padding:10px;
            background:white;
            border-radius:10px;
        }

        button{
            padding:14px 35px;
            border:none;
            border-radius:30px;
            background:linear-gradient(to right,#00c853,#64dd17);
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            margin-top:15px;
            font-weight:bold;
        }

        button:hover{
            transform:scale(1.08);
            box-shadow:0 0 20px rgba(0,255,100,0.6);
        }

        .result{
            margin-top:30px;
            background:white;
            color:black;
            padding:20px;
            border-radius:15px;
        }

        .result img{
            width:250px;
            margin-top:15px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.2);
        }

        .confidence{
            color:green;
            font-size:24px;
            margin-top:10px;
        }

        .tips{
            background:#355b3f;
            padding: 15px;
            margin-top:20px;
            border-radius: 12px;
            color: #2e7d32;
            font-size: 18px;
        }

        .tips h3{
            margin-bottom:10px;
        }

        h1{
            font-size:48px;
            margin-bottom:20px;
            animation:pulse 2s infinite;
        }

        @keyframes pulse{
            0%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.05);
            }
            100%{
                transform:scale(1);
            }
        }
            .leaf{
                position:fixed;
                font-size:40px;
                animation:floatLeaf 8s linear infinite;
                capacity:0.7;
            }

            .leaf1{
                left:10%;
                animation-delay:0s;
            }

            .leaf2{
                left:50%;
                animation-delay:2s;
            }

            .leaf3{
                left:80%;
                animation-delay:4s;
            }

@keyframes floatLeaf{
    0%{
        top:-10%;
        transform:rotate(0deg);
    }

    100%{
        top:110%;
        transform:rotate(360deg);
    }
}

    </style>

</head>
<body>

<div class="leaf leaf1">🍃</div>
<div class="leaf leaf2">🍃</div>
<div class="leaf leaf3">🍃</div>

<div class="container">

<body>

<div class="container">

<select id="language" onchange="changeLanguage()">
    <option value="en">English</option>
    <option value="kn">Kannada</option>
    <option value="hi">Hindi</option>
</select>

<h1 id="title">LeafScan AI</h1>

    <h1>🌿 LeafScan AI</h1>

    <p class="tagline">Smart Tomato Leaf Disease Detection System🌿</p>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Predict Disease</button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction: {{ prediction }}</h2>

        <h3>Confidence: {{ confidence }}%</h3>

        <div class=""progress-bar"></div>

        <div class="progress-bar">
            <div class=""progress" style=""width: {{ confidence }}%
                 {{ confidence }}%"></div>
        </div>
        
        <img src="{{ image_path }}" width="250">

        <h3 id="descHeading">🧪 Disease Description</h3>
        <p id="descText">{{ description }}</p>

    
        <div class="tips">
            <h3 id="treatHeading">💡 Treatment Suggestions</h3>
            <p id="treatText">{{ treatment }}</p>
        </div>

    {% endif %}

</div>

<script>
    if ("{{prediction}}"){

        let msg = new SpeechSynthesisUtterance("Detected {{ prediction }}");
        speechSynthesis.speak(msg);
    }
</script>
<script>

if("{{prediction}}"){

    let msg = new SpeechSynthesisUtterance(
    "Detected {{ prediction }}");

    speechSynthesis.speak(msg);

}

function changeLanguage(){

    let lang = document.getElementById("language").value;

    // Current texts
    let disease = document.getElementById("descText");
    let treatment = document.getElementById("treatText");

    if(lang=="kn"){

        document.getElementById("title").innerText =
        "ಲೀಫ್‌ಸ್ಕ್ಯಾನ್ AI";

        document.getElementById("predictBtn").innerText =
        "ರೋಗ ಪತ್ತೆಮಾಡಿ";

        document.getElementById("descHeading").innerText =
        "🧪 ರೋಗ ವಿವರಣೆ";

        document.getElementById("treatHeading").innerText =
        "🌱 ಚಿಕಿತ್ಸೆ ಸಲಹೆ";

        // Healthy
        if(disease.innerText.includes("healthy")){

            disease.innerText =
            "ನಿಮ್ಮ ಟೊಮ್ಯಾಟೊ ಸಸಿ ಆರೋಗ್ಯಕರವಾಗಿದೆ.";

            treatment.innerText =
            "ಸರಿಯಾದ ನೀರಾವರಿ ಮತ್ತು ಸೂರ್ಯಪ್ರಕಾಶವನ್ನು ಕಾಪಾಡಿ.";
        }

        // Early Blight
        else if(disease.innerText.includes("Early blight")){

            disease.innerText =
            "ಇದು ಟೊಮ್ಯಾಟೊ ಸಸಿಗೆ ತಗುಲುವ ಸಾಮಾನ್ಯ ಶಿಲೀಂಧ್ರ ರೋಗ.";

            treatment.innerText =
            "ಸೊಂಕಿತ ಎಲೆಗಳನ್ನು ತೆಗೆದುಹಾಕಿ ಮತ್ತು ಫಂಗಿಸೈಡ್ ಬಳಸಿ.";
        }

        // Late Blight
        else if(disease.innerText.includes("Late blight")){

            disease.innerText =
            "ಇದು ಗಂಭೀರ ರೋಗವಾಗಿದ್ದು ಸಸಿಯನ್ನು ಬೇಗ ಹಾಳುಮಾಡಬಹುದು.";

            treatment.innerText =
            "ಹೆಚ್ಚಿನ ತೇವಾಂಶ ತಪ್ಪಿಸಿ ಮತ್ತು ಕ್ಲೋರೋಥಾಲೋನಿಲ್ ಬಳಸಿ.";
        }

    }

    else if(lang=="hi"){

        document.getElementById("title").innerText =
        "लीफस्कैन AI";

        document.getElementById("predictBtn").innerText =
        "रोग पहचानें";

        document.getElementById("descHeading").innerText =
        "🧪 रोग विवरण";

        document.getElementById("treatHeading").innerText =
        "🌱 उपचार सुझाव";

        // Healthy
        if(disease.innerText.includes("healthy")){

            disease.innerText =
            "आपका टमाटर पौधा स्वस्थ है।";

            treatment.innerText =
            "उचित पानी और धूप बनाए रखें।";
        }

        // Early Blight
        else if(disease.innerText.includes("Early blight")){

            disease.innerText =
            "यह टमाटर पौधों में होने वाला फंगल रोग है।";

            treatment.innerText =
            "संक्रमित पत्तियां हटाएं और फंगीसाइड का उपयोग करें।";
        }

        // Late Blight
        else if(disease.innerText.includes("Late blight")){

            disease.innerText =
            "यह गंभीर रोग पौधे को जल्दी नुकसान पहुंचाता है।";

            treatment.innerText =
            "अधिक नमी से बचें और क्लोरोथालोनिल स्प्रे करें।";
        }

    }

    else{

        location.reload();

    }

}

</script>

</body>
</html>
