<!DOCTYPE html>
<html>
<head>
    <title>LeafScan AI</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#d4fc79,#96e6a1);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:450px;
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#2e7d32;
            margin-bottom:20px;
        }

        input[type=file]{
            margin:15px 0;
        }

        button{
            background:#2e7d32;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1b5e20;
        }

        .result{
            margin-top:25px;
            padding:15px;
            background:#f1f8e9;
            border-radius:10px;
        }

        .preview{
            margin-top:20px;
        }

        img{
            width:200px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .footer{
            margin-top:20px;
            color:gray;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍅 LeafScan AI</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Predict Disease</button>

    </form>

    {% if prediction %}

    <div class="result">

         <h2>Prediction: {{ prediction }}</h2>

         <h3>Confidence: {{ confidence }}%</h3>

         <img src="{{ image_path }}" width="250">

    </div>

    {% endif %}

    {% if image_path %}

    <div class="preview">

        <img src="{{ image_path }}">

    </div>

    {% endif %}

    <div class="footer">
        Powered by Deep Learning 🌱
    </div>

</div>

</body>
</html>
